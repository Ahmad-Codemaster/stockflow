<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="230" r="180" fill="#818CF8" opacity="0.12" filter="blur(40px)" />

  <!-- Geometric Modern Warehouse / Inventory Symbol -->
  <g filter="url(#glow)">
    <!-- Roof / Peak -->
    <path d="M256 112L392 186V216L256 142L120 216V186L256 112Z" fill="url(#boxGrad)" />
    <!-- Center Column / Support -->
    <path d="M256 156L376 220V362L256 426L136 362V220L256 156Z" fill="url(#boxGrad)" fill-opacity="0.95" />
    
    <!-- 3D Cube Isometric Faces -->
    <!-- Top Face -->
    <path d="M256 180L348 230L256 280L164 230L256 180Z" fill="#FFFFFF" />
    <!-- Left Face -->
    <path d="M164 242L250 288V388L164 340V242Z" fill="#CBD5E1" />
    <!-- Right Face -->
    <path d="M262 288L348 242V340L262 388V288Z" fill="#94A3B8" />

    <!-- Vibrant Orange Operations Flow Pulse Arrow -->
    <path d="M228 298L284 266L284 316L228 348Z" fill="url(#accentGrad)" />
  </g>
</svg>
